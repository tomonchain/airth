# Check every pull request (and main) the way chats are checked locally:
# formatting, lints and tests. Releases are built by release.yml.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: |
          git config --global user.name "Airth CI"
          git config --global user.email "ci@airth.invalid"
          cargo test --locked

  # Milestone 9 (decision 67): the same checks on Linux, where commands run
  # under bubblewrap; the sandbox's tests run here for real.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 24.04 restricts user namespaces through AppArmor; bubblewrap
      # needs them. The step fails if bwrap cannot start, so the sandbox's
      # tests never pass by skipping themselves.
      - name: Bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-net -- true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: |
          git config --global user.name "Airth CI"
          git config --global user.email "ci@airth.invalid"
          cargo test --locked

  # The interface in web/ (decision 73): it type-checks, it builds, and the
  # build committed in web/dist (which the binary embeds) is that build.
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: The committed build is up to date
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "web/dist differs from the build: run npm run build in web/ and commit web/dist."
            exit 1
          fi
