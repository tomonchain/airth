[package]
name = "airth"
version = "0.1.2"
edition = "2024"
license = "FSL-1.1-ALv2"
repository = "https://github.com/tomonchain/airth"

[dependencies]
anyhow = "1.0.104"
# Already built for TLS (via rustls); used directly for SHA-256 (OAuth PKCE).
aws-lc-rs = { version = "1", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = "3.5.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
tiny_http = "0.12.0"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.8"
tao = "0.37"
tray-icon = "0.26"
wry = "0.57"

[dev-dependencies]
tempfile = "3.27.0"
