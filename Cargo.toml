[package]
name = "airth"
version = "0.1.5"
edition = "2024"
license = "FSL-1.1-ALv2"
repository = "https://github.com/tomonchain/airth"

[dependencies]
anyhow = "1.0.104"
# Already built for TLS (via rustls); used directly for SHA-256 (OAuth PKCE).
aws-lc-rs = { version = "1", default-features = false }
# Already built (through reqwest's TLS stack); used directly to read a .docx
# and a PDF's compressed text (decision 86).
flate2 = "1.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = "3.5.2"
qrcode = { version = "0.14.1", default-features = false }
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
# Business state in SQLite, built in (decision 31).
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
tiny_http = "0.12.0"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.9"
tao = "0.37"
tray-icon = "0.26"
wry = "0.57"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
# One small, fast binary: whole-program optimization, no debug symbols.
lto = true
codegen-units = 1
strip = true
