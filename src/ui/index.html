<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airth</title>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar">
    <div class="side-top">
      <div class="realm-switch" id="realm-switch"></div>
      <button class="icon-action" id="side-close" type="button" title="Close the menu" aria-label="Close the menu"></button>
    </div>
    <nav class="side-nav" id="side-nav" aria-label="Airth"></nav>
    <nav class="run-list" id="run-list" aria-label="Chats"></nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>
  <button class="icon-action side-open" id="side-open" type="button" title="Menu" aria-label="Open the menu"></button>

  <main class="main" id="main"></main>
</div>
<footer class="statusbar" id="statusbar" aria-label="Usage"></footer>
<script src="/app.js"></script>
</body>
</html>
